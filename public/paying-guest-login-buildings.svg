<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Premium Paying Guest buildings login artwork</title>
<desc id="desc">Three modern premium paying guest buildings at dusk for a login screen hero area.</desc>

<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0b2a63"/>
    <stop offset="48%" stop-color="#173f83"/>
    <stop offset="78%" stop-color="#6f6f9b"/>
    <stop offset="100%" stop-color="#f1a66f"/>
  </linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#20314b"/>
    <stop offset="100%" stop-color="#0c1525"/>
  </linearGradient>
  <linearGradient id="b1" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f4efe6"/>
    <stop offset="100%" stop-color="#a9957e"/>
  </linearGradient>
  <linearGradient id="b2" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#eceff4"/>
    <stop offset="100%" stop-color="#7d8796"/>
  </linearGradient>
  <linearGradient id="b3" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f2f0eb"/>
    <stop offset="100%" stop-color="#9e8d79"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#182b4b"/>
    <stop offset="100%" stop-color="#0b172b"/>
  </linearGradient>
  <radialGradient id="lampGlow">
    <stop offset="0%" stop-color="#ffd780" stop-opacity=".9"/>
    <stop offset="100%" stop-color="#ffd780" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#061126" flood-opacity=".48"/>
  </filter>
  <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="16"/>
  </filter>
</defs>

<!-- dusk background -->
<rect width="1600" height="900" fill="url(#sky)"/>
<circle cx="1240" cy="120" r="130" fill="#ffffff" opacity=".07"/>
<ellipse cx="820" cy="780" rx="900" ry="150" fill="#f7b37b" opacity=".10"/>

<!-- distant skyline -->
<g opacity=".16" fill="#0b1830">
  <rect x="50" y="360" width="90" height="220" rx="8"/>
  <rect x="150" y="420" width="70" height="160" rx="8"/>
  <rect x="1310" y="390" width="90" height="190" rx="8"/>
  <rect x="1410" y="340" width="110" height="240" rx="8"/>
</g>

<!-- greenery -->
<g fill="#0b2b2b" opacity=".92">
  <circle cx="60" cy="520" r="90"/><circle cx="110" cy="470" r="72"/>
  <circle cx="1540" cy="470" r="92"/><circle cx="1485" cy="430" r="74"/>
</g>
<g fill="#173c34" opacity=".75">
