    <rect x="163" y="188" width="52" height="46" rx="7"/><rect x="231" y="188" width="52" height="46" rx="7"/>
    <rect x="163" y="258" width="52" height="46" rx="7"/><rect x="231" y="258" width="52" height="46" rx="7"/>
