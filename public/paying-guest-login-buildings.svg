    <rect x="192" y="127" width="58" height="34" rx="6"/><rect x="284" y="127" width="58" height="34" rx="6"/>
    <rect x="81" y="203" width="64" height="40" rx="6"/>
  </g>

  <g fill="#ffffff" opacity=".18">
    <rect x="62" y="178" width="102" height="9" rx="4"/><rect x="360" y="178" width="76" height="9" rx="4"/>
    <rect x="62" y="260" width="102" height="9" rx="4"/><rect x="360" y="260" width="76" height="9" rx="4"/>
    <rect x="172" y="180" width="190" height="9" rx="4"/><rect x="172" y="264" width="190" height="9" rx="4"/>
