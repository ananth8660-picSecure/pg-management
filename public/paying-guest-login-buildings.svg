  <circle cx="202" cy="704" r="56" fill="url(#lampGlow)" filter="url(#softGlow)"/>
  <circle cx="880" cy="704" r="66" fill="url(#lampGlow)" filter="url(#softGlow)"/>
  <circle cx="1354" cy="704" r="56" fill="url(#lampGlow)" filter="url(#softGlow)"/>
</g>

<!-- cars / driveway accents -->
