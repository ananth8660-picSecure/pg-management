  <text x="72" y="52" fill="#b8c5df" font-family="Arial, sans-serif" font-size="13">Executive hostel property</text>
</g>
<g transform="translate(1140 770)">
  <rect width="340" height="72" rx="22" fill="#10182c" opacity=".78" stroke="#ffffff" stroke-opacity=".14"/>
  <circle cx="38" cy="36" r="18" fill="#5ccfbd"/>
  <circle cx="32" cy="33" r="5" fill="#fff"/><circle cx="44" cy="33" r="5" fill="#fff"/><path d="M26 45c3-6 9-8 12-8s9 2 12 8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
